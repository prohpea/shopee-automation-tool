[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shopee-automation-tool"
version = "1.0.0"
description = "A modular, robust, anti-detection browser automation and scraping tool for Shopee"
readme = "README.md"
authors = [{ name = "Shopee Tool Dev" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "adbutils>=2.0.0"
]

[tool.setuptools.package-data]
"shopee_tool.modules" = ["*.js"]

[project.scripts]
shopee = "cli:cli"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q"
